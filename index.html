<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="calculadora gasolina ou álcool">
    <title>calculadora gasolina ou Álcool</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <main class="container">
        <img class="logo" src="./assets/logo.png" alt="Logo da calculadora gasolina ou álcool">
     <h1 class="title">Qual é a melhor opção?</h1>

     <form 
     onsubmit="calcular(event)"
     class="form">
     
        <label>Álcool (Preço por litro):</label>
            <input
            id="alcool"
            class="input" 
            type="number"
            placeholder="Digite o valor!"
            min="1"
            step="0.01"
            required
        >

        <label>Gasolina (Preço por gasolina):</label>
         <input 
         id="gasolina"
         class="input"
         type="number"
         placeholder="Digite o valor!"
         min="1"
         step="0.01"
         required
         />

        
        <input 
          class="button"
          type="submit" 
          value="Calcular" />
     </form>

     <section id="content-result" class="result hide">
        <span id="text-result">Compensa usar Álcool</span>

        <span id="alcool-result">Álcool R$ 3.90</span>
        <span id="gasolina-result">Gasolina R$ 6.80</span>
     </section>

    </main>

    <div class="info">
        <span class="tooltip">
            Veja como é feito esse cálculo!
        </span>
        <a href="calculohtml/calculo.html">
            <img 
            class= "info-img" 
            src="./assets/info.png" alt="Veja como é feito esse cálculo!" />
        </a>
    </div>
    
    <script src="./js/script.js"></script>
</body>

</html>
